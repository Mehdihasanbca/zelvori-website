name: Configure Name.com DNS for Zelvori

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit current records or apply GitHub Pages DNS records"
        type: choice
        required: true
        default: audit
        options:
          - audit
          - apply
      confirmation:
        description: 'For apply mode, type exactly: APPLY DNS'
        type: string
        required: false

permissions:
  contents: read

jobs:
  dns:
    name: Audit or configure domain DNS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NAMECOM_USERNAME: ${{ secrets.NAMECOM_USERNAME }}
      NAMECOM_TOKEN: ${{ secrets.NAMECOM_TOKEN }}
      DNS_MODE: ${{ inputs.mode }}
      DNS_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Audit or configure Name.com DNS
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          DOMAIN = "zelvori.software"
          API_BASE = f"https://api.name.com/v4/domains/{DOMAIN}/records"
          A_RECORDS = [
              "185.199.108.153",
              "185.199.109.153",
              "185.199.110.153",
              "185.199.111.153",
          ]
          AAAA_RECORDS = [
              "2606:50c0:8000::153",
              "2606:50c0:8001::153",
              "2606:50c0:8002::153",
              "2606:50c0:8003::153",
          ]
          WWW_TARGET = "mehdihasanbca.github.io"
          username = os.environ.get("NAMECOM_USERNAME", "")
          token = os.environ.get("NAMECOM_TOKEN", "")
          mode = os.environ.get("DNS_MODE", "audit")
          confirmation = os.environ.get("DNS_CONFIRMATION", "")
          if not username or not token:
              print("Missing GitHub Actions secrets. Add NAMECOM_USERNAME and NAMECOM_TOKEN in repository Settings > Secrets and variables > Actions.")
              sys.exit(1)

          auth = base64.b64encode(f"{username}:{token}".encode("utf-8")).decode("ascii")

          def api(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Basic {auth}",
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "Zelvori-NameCom-DNS-Workflow",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      raw = response.read()
                      return json.loads(raw.decode("utf-8")) if raw else {}
              except urllib.error.HTTPError as exc:
                  print(f"Name.com API request failed: HTTP {exc.code} ({method} {urllib.parse.urlsplit(url).path}).")
                  if exc.code == 401:
                      print("Check that NAMECOM_USERNAME is the API username shown in Name.com API Token Management, and NAMECOM_TOKEN is the matching production token.")
                  elif exc.code == 403:
                      print("The Name.com API account/token may not be permitted to manage this domain.")
                  sys.exit(1)
              except urllib.error.URLError as exc:
                  print(f"Could not reach Name.com API: {exc.reason}")
                  sys.exit(1)

          def list_records():
              url = API_BASE + "?page=1&perPage=1000"
              data = api("GET", url)
              records = data.get("records", [])
              if not isinstance(records, list):
                  print("Unexpected DNS records response from Name.com API.")
                  sys.exit(1)
              return records

          def host_of(record):
              return (str(record.get("host") or "").strip().lower().rstrip("."))

          def is_apex(record):
              return host_of(record) in ("", "@", DOMAIN)

          def is_www(record):
              return host_of(record) in ("www", "www." + DOMAIN)

          def typ(record):
              return str(record.get("type") or "").upper()

          def answer(record):
              return str(record.get("answer") or "").strip().rstrip(".")

          def rec_id(record):
              return record.get("id", record.get("record_id"))

          def show_relevant(records):
              relevant = [r for r in records if (is_apex(r) and typ(r) in ("A", "AAAA", "ALIAS", "ANAME", "CNAME")) or (is_www(r) and typ(r) in ("A", "AAAA", "ALIAS", "ANAME", "CNAME"))]
              if not relevant:
                  print("No apex A/AAAA/alias or www web records currently found.")
              else:
                  print("Current relevant DNS records (MX/TXT and other unrelated records are not displayed or modified):")
                  for r in relevant:
                      print(f"  id={rec_id(r)} host={host_of(r) or '@'} type={typ(r)} answer={answer(r)} ttl={r.get('ttl', 300)}")

          def write_record(method, record=None, payload=None):
              if method == "POST":
                  return api("POST", API_BASE, payload)
              if method == "PUT":
                  return api("PUT", API_BASE + "/" + urllib.parse.quote(str(rec_id(record)), safe=""), payload)
              if method == "DELETE":
                  return api("DELETE", API_BASE + "/" + urllib.parse.quote(str(rec_id(record)), safe=""))
              raise ValueError("Unsupported DNS operation")

          def rr_payload(host, rrtype, rranswer):
              return {"host": host, "type": rrtype, "answer": rranswer, "ttl": 300}

          def ensure_apex_rrset(records, rrtype, desired, convertible_types):
              apex = [r for r in records if is_apex(r)]
              existing = [r for r in apex if typ(r) == rrtype]
              matching_first = next((r for r in existing if answer(r) == desired[0]), None)
              if matching_first is None:
                  reusable = next((r for r in existing if answer(r) not in desired), None)
                  if reusable is None:
                      reusable = next((r for r in apex if typ(r) in convertible_types), None)
                  payload = rr_payload("@", rrtype, desired[0])
                  if reusable is not None:
                      print(f"Updating apex record id={rec_id(reusable)} to {rrtype} {desired[0]}")
                      write_record("PUT", reusable, payload)
                  else:
                      print(f"Creating apex {rrtype} {desired[0]}")
                      write_record("POST", payload=payload)

              records = list_records()
              existing = [r for r in records if is_apex(r) and typ(r) == rrtype]
              present = {answer(r) for r in existing}
              for value in desired:
                  if value not in present:
                      print(f"Creating apex {rrtype} {value}")
                      write_record("POST", payload=rr_payload("@", rrtype, value))

              records = list_records()
              keep_by_answer = set()
              for r in [x for x in records if is_apex(x) and typ(x) == rrtype]:
                  value = answer(r)
                  if value not in desired or value in keep_by_answer:
                      print(f"Removing conflicting/duplicate apex {rrtype} record id={rec_id(r)} answer={value}")
                      write_record("DELETE", r)
                  else:
                      keep_by_answer.add(value)

              if rrtype == "A":
                  records = list_records()
                  for r in [x for x in records if is_apex(x) and typ(x) in ("ALIAS", "ANAME", "CNAME")]:
                      print(f"Removing conflicting apex {typ(r)} record id={rec_id(r)}")
                      write_record("DELETE", r)

          def ensure_www_cname(records):
              www = [r for r in records if is_www(r)]
              unsupported = [r for r in www if typ(r) not in ("A", "AAAA", "ALIAS", "ANAME", "CNAME")]
              if unsupported:
                  print("Cannot safely create www CNAME because other www records exist:")
                  for r in unsupported:
                      print(f"  id={rec_id(r)} type={typ(r)} answer={answer(r)}")
                  print("Review these records manually, then rerun the workflow.")
                  sys.exit(1)

              existing_correct = next((r for r in www if typ(r) == "CNAME" and answer(r).lower() == WWW_TARGET), None)
              if existing_correct is not None:
                  keeper = existing_correct
              else:
                  reusable = next((r for r in www if typ(r) == "CNAME"), None)
                  if reusable is None:
                      reusable = next(iter(www), None)
                  payload = rr_payload("www", "CNAME", WWW_TARGET)
                  if reusable is not None:
                      print(f"Updating www record id={rec_id(reusable)} to CNAME {WWW_TARGET}")
                      result = write_record("PUT", reusable, payload)
                      keeper_id = result.get("id", rec_id(reusable)) if isinstance(result, dict) else rec_id(reusable)
                      keeper = {"id": keeper_id, "host": "www", "type": "CNAME", "answer": WWW_TARGET, "ttl": 300}
                  else:
                      print(f"Creating www CNAME {WWW_TARGET}")
                      result = write_record("POST", payload=payload)
                      keeper = {"id": result.get("id"), "host": "www", "type": "CNAME", "answer": WWW_TARGET, "ttl": 300}

              records = list_records()
              current_www = [r for r in records if is_www(r)]
              # Do not delete unrelated record types. Preflight above stops before any writes if those existed.
              for r in current_www:
                  if str(rec_id(r)) == str(rec_id(keeper)) and typ(r) == "CNAME" and answer(r).lower() == WWW_TARGET:
                      continue
                  if typ(r) in ("A", "AAAA", "ALIAS", "ANAME", "CNAME"):
                      print(f"Removing conflicting/duplicate www {typ(r)} record id={rec_id(r)}")
                      write_record("DELETE", r)

          records = list_records()
          show_relevant(records)
          print("")
          print("Target configuration:")
          for value in A_RECORDS:
              print(f"  @ A {value}")
          for value in AAAA_RECORDS:
              print(f"  @ AAAA {value}")
          print(f"  www CNAME {WWW_TARGET}")

          if mode != "apply":
              print("")
              print("AUDIT ONLY: no DNS changes were made.")
              print("To apply changes, run this workflow again with mode=apply and confirmation exactly 'APPLY DNS'.")
              sys.exit(0)

          if confirmation != "APPLY DNS":
              print("Refusing to change DNS: confirmation input must be exactly 'APPLY DNS'. No DNS changes were made.")
              sys.exit(1)

          # Safety preflight: don't start modifying records if a www TXT/MX/etc. record would conflict with CNAME.
          records = list_records()
          www = [r for r in records if is_www(r)]
          unsupported = [r for r in www if typ(r) not in ("A", "AAAA", "ALIAS", "ANAME", "CNAME")]
          if unsupported:
              print("DNS preflight failed: unexpected www record types exist. No DNS changes were made.")
              for r in unsupported:
                  print(f"  id={rec_id(r)} type={typ(r)} answer={answer(r)}")
              sys.exit(1)

          print("")
          print("Applying DNS configuration...")
          ensure_apex_rrset(list_records(), "A", A_RECORDS, ("ALIAS", "ANAME", "CNAME"))
          ensure_apex_rrset(list_records(), "AAAA", AAAA_RECORDS, ())
          ensure_www_cname(list_records())

          final_records = list_records()
          def actual_values(rrtype):
              return {answer(r) for r in final_records if is_apex(r) and typ(r) == rrtype}
          final_www = [r for r in final_records if is_www(r) and typ(r) == "CNAME"]
          errors = []
          for rrtype, desired in (("A", A_RECORDS), ("AAAA", AAAA_RECORDS)):
              got = actual_values(rrtype)
              if got != set(desired):
                  errors.append(f"@ {rrtype} expected {sorted(desired)}, got {sorted(got)}")
          if not any(answer(r).lower() == WWW_TARGET for r in final_www):
              errors.append(f"www CNAME expected {WWW_TARGET}")
          if errors:
              print("DNS changes were attempted, but final verification found mismatches:")
              for error in errors:
                  print("  " + error)
              sys.exit(1)
          print("")
          print("SUCCESS: Name.com DNS records now match the GitHub Pages targets.")
          print("DNS propagation and GitHub Pages HTTPS certificate provisioning may still take time.")
          PY