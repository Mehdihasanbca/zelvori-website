name: Deploy Zelvori to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Run ESLint
        run: npm run lint

      - name: Build Static Site with Next.js
        run: |
          npm run build

      - name: Verify Static Output and CNAME
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory not found. Static export failed."
            exit 1
          fi
          if [ ! -f "out/CNAME" ]; then
            echo "Copying CNAME to out directory..."
            cp public/CNAME out/CNAME || echo "zelvori.software" > out/CNAME
          fi
          echo "Running automated security regression tests:"
          npm run verify
          echo "Running generated-site QA and interaction audits:"
          node scripts/qa-audit.mjs
          npm run seo:audit
          npm run check:duplicates

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository for IndexNow notification
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test live homepage and discovery endpoints
        run: node scripts/smoke-test-deployed-site.mjs
        continue-on-error: true

      - name: Notify IndexNow of published URLs
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true
